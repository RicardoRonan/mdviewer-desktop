name: Release

# Builds the Windows install wizard and the Linux AppImage/deb on every version
# tag, then publishes them as GitHub Release assets. That release page is the
# "download links" hub referenced from the README.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: MDViewer

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Derive version from tag or gradle.properties
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep -m1 '^version' gradle.properties | cut -d= -f2 | tr -d ' ')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

  build-windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate icon.ico
        shell: pwsh
        run: |
          if (-not (Test-Path packaging/icon.ico)) {
            java packaging/make-ico.java packaging/icon.ico
          }

      - name: Build runtime app-image
        shell: pwsh
        run: .\gradlew.bat createDistributable --console=plain

      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          # Inno Setup 6 is preinstalled on windows-latest runners.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $version = "${{ needs.version.outputs.version }}"
          $appImage = Join-Path $pwd "build\compose\binaries\main\app\MDViewer"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & $iscc "/DMyAppVersion=$version" "/DMyAppExeDir=$appImage" "packaging\windows\MDViewer.iss"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/MDViewer-*-Setup.exe
          if-no-files-found: error

  build-linux:
    name: Linux AppImage and deb
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packaging deps
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build AppImage and deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x packaging/build-appimage.sh
          ./packaging/build-appimage.sh
          ./gradlew packageDeb --console=plain

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp release/MDViewer-*-x86_64.AppImage out/ || true
          cp build/compose/binaries/main/deb/*.deb out/
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lR dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: MDViewer ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body: |
            Offline Markdown reader with portable, block-anchored annotations.

            ## Downloads
            | Platform | File |
            | --- | --- |
            | Windows 10/11 (x64) | `MDViewer-${{ needs.version.outputs.version }}-Setup.exe` |
            | Linux (AppImage) | `MDViewer-${{ needs.version.outputs.version }}-x86_64.AppImage` |
            | Linux (Debian/Ubuntu) | the `.deb` package |

            **Windows:** run the installer, then open any `.md` file. The first launch shows a
            SmartScreen warning because the build is unsigned — click **More info → Run anyway**.
            **Linux AppImage:** `chmod +x MDViewer-*.AppImage && ./MDViewer-*.AppImage`
